<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>志校儿的博客</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="header-content">
            <img src="my.jpg" alt="头像" class="avatar">
            <div>
                <h1 class="blog-title">志校儿的博客</h1>
                <div class="blog-url">
                    个人网站：<a href="https://zhischooler.pages.dev" target="_blank">zhischooler.pages.dev</a>
                </div>
            </div>
        </div>
    </header>

    <!-- 搜索和标签 -->
    <div class="controls">
        <input type="text" class="search-box" id="searchBox" placeholder="搜索文章...">
        <div class="tags" id="tagsContainer">
            <span class="tag active" data-tag="all">全部</span>
            <span class="tag" data-tag="technology">技术</span>
            <span class="tag" data-tag="life">生活</span>
            <span class="tag" data-tag="study">学习</span>
        </div>
    </div>

    <!-- 博客列表 -->
    <main class="container">
        <div class="post-list" id="postList">
            <!-- 博客文章将通过JavaScript动态生成 -->
        </div>
        <div class="no-results" id="noResults" style="display: none;">
            没有找到相关文章
        </div>
    </main>

    <script>
        // 博客数据
        const blogPosts = [
            {
                title: "我的第一篇博客文章",
                tag: "technology",
                tagName: "技术",
                date: "2026-08-24",
                excerpt: "这是我的第一篇博客文章，记录了我在开发过程中的心得体会...",
                url: "posts/technology/first-post.html"
            },
            {
                title: "日常生活随笔",
                tag: "life",
                tagName: "生活",
                date: "2026-08-25",
                excerpt: "今天天气不错，出去散步的时候有很多感想，记录下来...",
                url: "posts/life/daily-thoughts.html"
            },
            {
                title: "学习笔记分享",
                tag: "study",
                tagName: "学习",
                date: "2026-08-26",
                excerpt: "最近在学习新的技术，整理了一些学习笔记分享给大家...",
                url: "posts/study/learning-notes.html"
            },
            {
                title: "前端开发技巧",
                tag: "technology",
                tagName: "技术",
                date: "2026-08-26",
                excerpt: "分享一些我在前端开发中积累的实用技巧和最佳实践...",
                url: "posts/technology/frontend-tips.html"
            }
        ];

        let currentTag = 'all';
        let searchQuery = '';

        // 渲染博客列表
        function renderPosts() {
            const postList = document.getElementById('postList');
            const noResults = document.getElementById('noResults');
            
            // 过滤文章
            let filteredPosts = blogPosts.filter(post => {
                const matchTag = currentTag === 'all' || post.tag === currentTag;
                const matchSearch = post.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                   post.excerpt.toLowerCase().includes(searchQuery.toLowerCase());
                return matchTag && matchSearch;
            });

            // 清空列表
            postList.innerHTML = '';

            if (filteredPosts.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                
                filteredPosts.forEach(post => {
                    const postCard = document.createElement('div');
                    postCard.className = 'post-card';
                    postCard.onclick = () => window.location.href = post.url;
                    
                    postCard.innerHTML = `
                        <h2 class="post-title">${post.title}</h2>
                        <div class="post-meta">
                            <span>${post.date}</span>
                            <span class="post-tag">${post.tagName}</span>
                        </div>
                        <p class="post-excerpt">${post.excerpt}</p>
                    `;
                    
                    postList.appendChild(postCard);
                });
            }
        }

        // 标签点击事件
        document.getElementById('tagsContainer').addEventListener('click', (e) => {
            if (e.target.classList.contains('tag')) {
                // 移除所有active类
                document.querySelectorAll('.tag').forEach(tag => tag.classList.remove('active'));
                // 添加active类到当前标签
                e.target.classList.add('active');
                // 更新当前标签
                currentTag = e.target.dataset.tag;
                // 重新渲染
                renderPosts();
            }
        });

        // 搜索事件
        document.getElementById('searchBox').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderPosts();
        });

        // 初始化渲染
        renderPosts();
    </script>
</body>
</html>
